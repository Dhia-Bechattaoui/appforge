name: CI & Quality Audit

# Strictly manual trigger - NEVER runs automatically on push
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to pub.dev after all checks pass?'
        type: boolean
        default: false
        required: true

jobs:
  verify:
    name: Test, Analyze & Pana Verification (160/160)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze lib test

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Verify Package Dry-Run Publish
        run: dart pub publish --dry-run

      - name: Install Pana Package Analyzer
        run: dart pub global activate pana

      - name: Verify Pana Quality Score (Must be 160/160)
        run: dart pub global run pana --exit-code-threshold 0 .

  publish:
    name: Publish to pub.dev
    needs: verify
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev automated publishing using OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Publish Package to pub.dev
        run: dart pub publish --force